<!DOCTYPE html>
<html lang="en">
  <link rel="stylesheet" href="Style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Archive</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background: #1e5799 url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Vista Glass Outer Container */
        .vista-window {
            width: 820px;
            height: 550px;
            background: rgba(18, 48, 75, 0.45);
            border: 1px solid rgba(114, 180, 219, 0.8);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6), inset 0 0 2px rgba(255, 255, 255, 0.8), 0 0 12px rgba(114, 180, 219, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Windows Vista Title Bar */
        .title-bar {
            height: 30px;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(190,225,255,0.3) 45%, rgba(90,165,225,0.5) 50%, rgba(140,205,255,0.6) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px 0 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .title-text {
            color: #0b253a;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .window-controls { display: flex; gap: 2px; }
        .win-btn {
            width: 26px; height: 18px; border-radius: 2px;
            border: 1px solid rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: #fff; cursor: pointer; text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(150,180,200,0.3) 50%, rgba(60,90,110,0.6) 51%, rgba(120,160,190,0.5) 100%);
        }
        .win-btn.close {
            background: linear-gradient(180deg, #f8988b 0%, #e04434 50%, #b81c0c 51%, #e85c4c 100%);
            border-color: #700;
        }

        /* Blank Inner Body Window */
        .main-body {
            flex: 1;
            background: #ffffff;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="vista-window">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-text">The Aero Archive</div>
            <div class="window-controls">
                <div class="win-btn">—</div>
                <div class="win-btn">❏</div>
                <div class="win-btn close">✕</div>
            </div>
        </div>

        <!-- Blank Body Area -->
        <div class="main-body">
          <h3 style="text-align:center;">THE AERO ARCHIVES</h3>
          <p style="text-align:center;">Welcome, TO THE AERO ARCHIVE v0.1</p>
          <p style="text-align:center;">This is an archive of things from 2000 - 2009 Known as the Frutiger Era!</p>
          <button style="display: block; margin: 10 auto;">Continue to main page!</button>
            
        </div>
    </div>

</body>
</html>
